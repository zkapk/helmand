login:()=>`<div class="au">${LG(54)}<h1>ښه راغلاست!</h1><p>خپل حساب ته ننوځئ</p><input id="e" class="sbox" type="email" dir="ltr" placeholder="بریښنالیک (Email)"><input id="p" class="sbox" type="password" dir="ltr" placeholder="پټنوم"><div id="er" class="er"></div><button id="sb" class="big" onclick="doLogin()">ننوتل</button><p class="sw">حساب نه لرئ؟ <a onclick="go('signup')">نوی حساب جوړ کړئ</a></p></div>`,
signup:()=>`<div class="au"><div class="stp"><i class="d"></i><i></i></div>${LG(54)}<h1>نوی حساب</h1><p>لومړی ګام: بریښنالیک او پټنوم</p><input id="e" class="sbox" type="email" dir="ltr" placeholder="بریښنالیک (Email)" value="${esc(SU.e||'')}"><input id="p" class="sbox" type="password" dir="ltr" placeholder="پټنوم (لږ تر لږه ۶ توري)"><div id="er" class="er"></div><button id="sb" class="big" onclick="next1()">بل ←</button><p class="sw">مخکې حساب لرئ؟ <a onclick="go('login')">ننوتل</a></p></div>`,
signup2:()=>`<div class="au"><div class="stp"><i class="d"></i><i class="d"></i></div><h1>خپل معلومات</h1><p>دوهم ګام: ځان معرفي کړئ</p><div class="ph" id="phv" onclick="$('#pf').click()">📷</div><input id="pf" type="file" accept="image/*" hidden onchange="pick(this)"><p style="text-align:center;font-size:12px;margin-bottom:12px">د پروفایل عکس (اختیاري)</p><input id="n" class="sbox" placeholder="نوم"><input id="l" class="sbox" placeholder="تخلص"><div class="rl">${[['customer','🛍️','مشتری','خواړه او توکي آرډر کوم'],['shop','🏪','سوداګر','خپل دوکان یا شرکت اداره کوم'],['rider','🛵','ډرایور','آرډرونه رسوم']].map(([k,e,t,d])=>`<button data-k="${k}" class="${SU.role==k?'on':''}" onclick="role('${k}')"><span>${e}</span><div><b>${t}</b><small>${d}</small></div></button>`).join('')}</div><div id="er" class="er"></div><button id="sb" class="big" onclick="doSign()">حساب جوړ کړئ</button><p class="sw"><a onclick="go('signup')">→ شاته</a></p></div>`,
panel:()=>{const r=U.role=='rider';return`<div class="au" style="text-align:center"><div class="av" style="width:90px;height:90px;font-size:38px">${AVT(U)}</div><h1>${esc(FN(U))}</h1><p>${r?'🛵 ډرایور':'🏪 سوداګر'}${U.biz?' · '+esc(U.biz):''}</p><div class="sum" style="text-align:right"><div><span>بریښنالیک</span><span dir="ltr">${esc(U.email)}</span></div></div>${r?'<p>د دوکان یا شرکت مالک باید ستاسو بریښنالیک په خپل پینل کې زیات کړي، بیا به آرډرونه درکول کېږي.</p>':U.biz?'<p>ستاسو پینل (محصولات، آرډرونه، ډرایوران) په بل ګام کې جوړېږي.</p>':'<p>د خپل دوکان یا شرکت نوم ولیکئ:</p><input id="bz" class="sbox" placeholder="د دوکان یا شرکت نوم"><button class="big" style="margin-bottom:12px" onclick="saveBiz()">نوم خوندي کړئ</button>'}<button class="big" style="background:#fff;color:#c62828;border:1px solid #f0c9c9;box-shadow:none" onclick="out()">وتل</button></div>`},
home:()=>`<div class="top"><button class="ic" onclick="drw(1)">☰</button><div class="logo">${LG(24)}هلمند <i>ایکسپرس</i></div><div class="city">📍 لښکرګاه</div></div><div class="pad">
<input class="sbox" placeholder="🔎 د خواړو، توکو یا دوکانونو لټون..." onfocus="go('search')" readonly>
<div class="ban"><b>ګرم او تازه</b><p>ستاسو خوښ خواړه، ستاسو د دروازې تر مخ</p><button class="cta" onclick="go('list',{t:'c',id:'food'})">اوس آرډر کړئ</button><em>🍔</em></div>
<div class="cats">${D.cats.map(c=>`<button class="cat" onclick="go('list',{t:'c',id:'${c.id}'})"><span style="background:${c.b}">${c.e}</span>${c.n}<small>${c.s}</small></button>`).join('')}</div>
<h2>مشهور رستورانټونه</h2><div class="shops">${D.shops.filter(s=>s.c=='food').map(s=>`<button class="shop" onclick="go('list',{t:'s',id:'${s.id}'})"><div class="em">${s.e}</div><b>${s.n}</b><small>⭐ ${s.r} · ${s.s}</small></button>`).join('')}</div></div>`,
list:()=>{const a=S.a;if(a.t=='c'){const c=D.cats.find(x=>x.id==a.id);return head(c.n)+D.shops.filter(s=>s.c==a.id).map((s,i)=>`<button class="sl" style="animation-delay:${i*.07}s" onclick="go('list',{t:'s',id:'${s.id}'})"><div class="em">${s.e}</div><div class="f"><b>${s.n}</b><small>⭐ ${s.r} · ${s.s}</small></div>‹</button>`).join('')+'</div>'}
return head(shop(a.id).n)+D.items.filter(i=>i.sh==a.id).map(row).join('')+'</div>'},
search:()=>`<div class="pad" style="padding-top:18px"><input id="q" class="sbox" placeholder="🔎 لټون..." value="${esc(S.q)}" oninput="S.q=this.value;res()"><div id="res" style="margin-top:14px"></div></div>`,
cart:()=>{const ids=Object.keys(S.cart);if(!ids.length)return bar('زما کارټ')+empty('🛒','کارټ مو خالي دی. له کور څخه څه زیات کړئ.');
const s=sub();return bar('زما کارټ')+`<div class="pad">${ids.map(id=>row(item(id))).join('')}<div class="sum"><div><span>فرعي مجموع</span><span>${AF}${s}</span></div><div><span>د رسولو فیس</span><span>${AF}${FEE}</span></div><div class="tot"><span>ټول</span><span>${AF}${s+FEE}</span></div></div>
<label>تلیفون</label><input id="ph" class="sbox" type="tel" dir="ltr" placeholder="+93 7X XXX XXXX"><label>د رسولو پته</label><input id="ad" class="sbox" placeholder="سیمه، سړک، کور" value="${esc(S.ad)}"><button class="big" style="margin-top:16px" onclick="order()">چیک آوټ ته دوام ورکړئ</button></div>`},
orders:()=>{const f=S.f,L=S.orders.filter(o=>f=='ټول'||(f=='په تمه'?o.st<4:o.st==4));return bar('زما آرډرونه')+`<div class="pad"><div class="chips">${['ټول','په تمه','بشپړ'].map(x=>`<button class="chip ${x==f?'on':''}" onclick="S.f='${x}';render(1)">${x}</button>`).join('')}</div>`+(L.length?L.map(o=>`<button class="sl" onclick="go('track','${o.id}')"><div class="f"><b>#${o.no}</b><small>${new Date(o.ts).toLocaleString()} · ${o.n} توکي</small><span class="pr">${AF}${o.total}</span></div><span class="bd ${o.st==4?'ok':''}">${ST[o.st]}</span></button>`).join(''):empty('📦','دلته تر اوسه آرډر نشته.'))+'</div>'},
track:()=>{const o=S.a?S.orders.find(x=>x.id==S.a):S.orders.find(x=>x.st<4)||S.orders[0];if(!o)return bar('آرډر تعقیب')+empty('📍','تعقیبولو لپاره آرډر نشته. لومړی آرډر ورکړئ.');
return bar('آرډر تعقیب')+`<div class="pad"><p style="margin-bottom:12px;font-size:14px"><b>#${o.no}</b> · ${new Date(o.ts).toLocaleString()}<br><small style="color:var(--m)">${esc(o.addr)}</small></p><div class="tl">${ST.map((s,i)=>`<div class="st ${i<=o.st?'d':''} ${i==o.st&&o.st<4?'n':''}"><i></i>${s}</div>`).join('')}</div></div>`},
profile:()=>`${bar('پروفایل')}<div class="pad"><div class="av">${AVT(U)}</div><p style="text-align:center"><b>${esc(FN(U))}</b><br><small style="color:var(--m)">${esc(U.email||'')}</small></p><label>خوندي پته</label><input id="pa" class="sbox" value="${esc(S.ad)}" placeholder="سیمه، سړک، کور"><button class="big" style="margin-top:14px" onclick="S.ad=$('#pa').value;W('zad',S.ad);toast('خوندي شو ✓')">بدلونونه خوندي کړئ</button><button class="big" style="margin-top:10px;background:#fff;color:#c62828;border:1px solid #f0c9c9;box-shadow:none" onclick="out()">وتل</button><p class="emp" style="padding:24px">هلمند ایکسپرس · نسخه ۱.۰.۰${ON?'':'<br><small>(ډیمو حالت)</small>'}</p></div>`};
function res(){const q=S.q.trim().toLowerCase(),r=q?D.items.filter(i=>(i.n+shop(i.sh).n).toLowerCase().includes(q)):[];$('#res').innerHTML=r.length?r.map(row).join(''):empty('🔎',q?'څه ونه موندل شول.':'د خواړو، توکو یا دوکانونو نوم ولیکئ.')}
async function order(){const ph=$('#ph').value.trim(),ad=$('#ad').value.trim();if(!ph||!ad){toast('تلیفون او پته ولیکئ');return}
 S.ad=ad;W('zad',ad);const o={no:Date.now().toString().slice(-5),ts:Date.now(),n:cnt(),total:sub()+FEE,addr:ad,ph,st:0,uid:U.uid,items:S.cart};
 if(ON){try{const r=await fs.collection('orders').add(o);S.cart={};W('zc',{});go('track',r.id)}catch(e){toast('ستونزه: بیا هڅه وکړئ')}return}
 o.id='L'+o.no;S.orders.unshift(o);W('zo_'+U.uid,S.orders);S.cart={};W('zc',{});toast('آرډر ولېږل شو ✓');go('track',o.id)}
const TB=[['home','🏠','کور'],['search','🔎','لټون'],['cart','🛒','کارټ'],['orders','📦','آرډرونه'],['profile','👤','پروفایل']];
function render(q){const A=$('#app');A.className=q?'q':'';if(q===undefined){void A.offsetWidth}
 const AU=['login','signup','signup2'],ro=U&&U.role!='customer',au=!U||AU.includes(S.v)||ro;A.innerHTML=(!U&&!AU.includes(S.v)?V.login:V[ro?'panel':S.v])();if(S.v=='search')res();
 $('#nav').style.display=au?'none':'flex';const n=cnt(),cur=['list','track'].includes(S.v)?'home':S.v;
 $('#nav').innerHTML=TB.map(([k,e,l])=>`<button class="${cur==k?'on':''}" onclick="go('${k}')"><span>${e}</span>${l}${k=='cart'&&n?`<b>${n}</b>`:''}</button>`).join('');
 if(U&&!ro)$('#dr').innerHTML=`<div class="u"><div class="av">${AVT(U)}</div><div><b>${esc(FN(U))}</b><br><small style="color:var(--m)">${esc(U.email||'')}</small></div></div>`+[['home','🏠','کور'],['search','🔎','لټون'],['orders','📦','زما آرډرونه'],['track','📍','آرډر تعقیب'],['cart','🛒','کارټ'],['profile','👤','پروفایل']].map(([k,e,l])=>`<button class="m" onclick="go('${k}')"><span>${e}</span>${l}</button>`).join('')+`<button class="m" style="color:#c62828" onclick="out()"><span>🚪</span>وتل</button>`}
if(ON){firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore();auth.onAuthStateChanged(u=>{if(busy)return;if(!u){onUser(null);return}fs.collection('users').doc(u.uid).get().then(d=>{const x=d.exists?d.data():{};onUser({uid:u.uid,name:x.name||u.displayName||'',last:x.last||'',email:u.email,role:x.role||'customer',photo:x.photo||'',biz:x.biz||''})}).catch(()=>onUser({uid:u.uid,name:u.displayName||'',email:u.email,role:'customer',photo:''}))})}
else{const u=J('zu',null);if(u)onUser(u);else render()}
/* DEMO ONLY: order status advances every 15s. Online mode: admin changes it in Firestore. */
if(!ON)setInterval(()=>{let c=0;S.orders.forEach(o=>{if(o.st<4){o.st++;c=1}});if(c&&U){W('zo_'+U.uid,S.orders);if(['track','orders'].includes(S.v))render(1)}},15000);
setTimeout(()=>$('#splash').classList.add('h'),1500);
if(ON&&!U)render();
</script></body></html>
