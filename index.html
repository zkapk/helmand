function loadCmp(){fs.collection('complaints').orderBy('ts','desc').limit(50).get().then(s=>{S.cmp=s.docs.map(d=>d.data());if(S.v=='admin')render(1)}).catch(()=>{})}

async function rmDriver(id){try{await fs.collection('links').doc(id).delete();setTimeout(()=>render(1),300)}catch(e){toast(t('err'))}}
async function takeOrder(id){try{await fs.collection('orders').doc(id).update({st:3,rider:U.uid,rn:FN(U)})}catch(e){toast(t('err'))}}
